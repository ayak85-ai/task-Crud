<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Management System</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .title h1{
            font-size: 3rem;
            font-weight: bold;
            color: #222;
        }

        .title p{
            color: #777;
            font-size: 1.1rem;
        }

        .movie-form{
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .movie-form label{
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .form-control,
        .form-select{
            padding: 14px;
            border-radius: 12px;
        }

        .form-control:focus,
        .form-select:focus{
            box-shadow: none;
            border-color: #0d6efd;
        }

        textarea{
            resize: none;
        }

        .add-btn{
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
        }

        .movie-card{
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: 0.3s;
            height: 100%;
        }

        .movie-card:hover{
            transform: translateY(-8px);
        }

        .movie-image{
            height: 320px;
            overflow: hidden;
        }

        .movie-image img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-content{
            padding: 20px;
        }

        .movie-content h3{
            font-size: 1.5rem;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
        }

        .author{
            color: #0d6efd;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .category{
            display: inline-block;
            background-color: #eef4ff;
            color: #0d6efd;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .movie-content p{
            color: #666;
            line-height: 1.7;
            min-height: 80px;
        }

        .card-buttons button{
            border-radius: 10px;
            padding: 10px;
            font-weight: 500;
        }

    </style>
</head>
<body>


<section class="py-5">

    <div class="container">

        <!-- Title -->
        <div class="title text-center mb-5">

            <h1>Movie Management System</h1>

            <p>
                Add and manage your favorite movies بسهولة
            </p>

        </div>



        <!-- Form -->
        <div class="movie-form w-75 mx-auto mb-5">

            <div class="mb-4">

                <label >Movie Name</label>

                <input  id="movieName" type="text" class="form-control" placeholder="Enter movie name">

            </div>


            <div class="mb-4">

                <label >Author / Director</label>

                <input  id="authorDirector" type="text" class="form-control" placeholder="Enter author name">

            </div>



            <div class="mb-4">

                <label >Category</label>

                <select class="formSelect" id="select">

                    <option selected disabled>Choose Category</option>

                    <option>Action</option>
                    <option>Drama</option>
                    <option>Sci-Fi</option>
                    <option>Comedy</option>

                </select>

            </div>



            <div class="mb-4">

                <label >Description</label>

                <textarea  id="Description" rows="5" class="form-control" placeholder="Enter movie description"></textarea>

            </div>



            <div class="mb-4">

                <label >Movie Image</label>

                <input  id="moviImg" type="file" class="form-control" >

            </div>



            <button class="btn btn-primary w-100 add-btn" id="addbtn" onclick="addMovie()">

                <i class="bi bi-plus-circle-fill"></i>

                Add Movie

            </button>

        </div>



        <!-- Movies -->
        <div class="row g-4" id="rowData">



            <!-- Card -->
            

 </div>
</section>


<script src="JS/bootstrap.bundle.min.js"></script>
</body>
</html>
